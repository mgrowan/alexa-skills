name: Deploy

# Deploys the function to Azure Functions on every push to master.
#
# SETUP (one-time) — the deploy job stays skipped until both are configured:
#   1. Repository variable  AZURE_FUNCTIONAPP_NAME  = your Function App name
#        Settings → Secrets and variables → Actions → Variables → New repository variable
#   2. Repository secret     AZURE_FUNCTIONAPP_PUBLISH_PROFILE  = the app's publish profile
#        Get it with:
#          az functionapp deployment list-publishing-profiles \
#            --name <APP> --resource-group <RG> --xml
#        (or Portal → Function App → Get publish profile), then paste the whole XML
#        into Settings → Secrets and variables → Actions → Secrets → New repository secret.

on:
  push:
    branches: [master]
    paths:
      - "Claude.Answers/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: Claude.Answers/Claude.Answers.csproj
  DOTNET_VERSION: "8.0.x"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Dormant until you set the AZURE_FUNCTIONAPP_NAME repository variable.
    if: ${{ vars.AZURE_FUNCTIONAPP_NAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} --configuration Release --output ./publish

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
